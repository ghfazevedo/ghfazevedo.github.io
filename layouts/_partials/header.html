<header class="site-header" id="top">
<div class="wrap">
<a class="brand" href="{{ "/" | relURL }}">
{{- with (resources.Get "media/icon.png").Resize "96x96 png" }}<img src="{{ .RelPermalink }}" alt="" width="40" height="40">{{ end }}
<span>{{ site.Params.name }}</span>
</a>
<button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" onclick="var h=this.closest('.site-header');var o=h.classList.toggle('open');this.setAttribute('aria-expanded',o)">{{ partial "icon.html" "menu" }}</button>
<nav class="nav" aria-label="Main">
{{- $current := . }}
{{- range site.Menus.main }}
<a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a>
{{- end }}
<a class="cv-btn" href="{{ site.Params.cv | relURL }}">CV</a>
</nav>
</div>
</header>
